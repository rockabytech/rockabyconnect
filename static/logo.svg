<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130">
  <defs>
    <!-- Orange gradient for the icon background -->
    <linearGradient id="fundiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7b733"/>
      <stop offset="50%" stop-color="#f5af19"/>
      <stop offset="100%" stop-color="#e09e15"/>
    </linearGradient>

    <!-- Subtle shadow for the icon -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ========== ICON ========== -->
  <g filter="url(#iconShadow)">
    <!-- Rounded square background -->
    <rect x="10" y="15" width="100" height="100" rx="26" fill="url(#fundiGradient)"/>
    
    <!-- White hammer (left) -->
    <g transform="rotate(-15 55 65)">
      <!-- Hammer head -->
      <rect x="36" y="42" width="22" height="10" rx="3" fill="#ffffff"/>
      <!-- Hammer handle -->
      <rect x="45" y="50" width="5" height="30" rx="2" fill="#ffffff"/>
    </g>
    
    <!-- White wrench (right) -->
    <g transform="rotate(15 75 65)">
      <!-- Wrench head (open circle) -->
      <circle cx="78" cy="47" r="7" fill="none" stroke="#ffffff" stroke-width="3.5"/>
      <!-- Wrench handle -->
      <rect x="75.5" y="52" width="5" height="28" rx="2" fill="#ffffff"/>
    </g>
    
    <!-- Alibaba-style smile curve at bottom -->
    <path d="M 30 88 Q 60 102 90 88" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.95"/>
  </g>

  <!-- ========== WORDMARK ========== -->
  <!-- "FUNDI" in bold black -->
  <text x="135" y="82"
        font-family="Poppins, Inter, Montserrat, Arial, sans-serif"
        font-size="54"
        font-weight="900"
        fill="#1a1a2e"
        letter-spacing="-2">FUNDI</text>

  <!-- "HUB" in bold orange -->
  <text x="320" y="82"
        font-family="Poppins, Inter, Montserrat, Arial, sans-serif"
        font-size="54"
        font-weight="900"
        fill="#f5af19"
        letter-spacing="-2">HUB</text>

  <!-- ========== TAGLINE ========== -->
  <text x="138" y="108"
        font-family="Poppins, Inter, Montserrat, Arial, sans-serif"
        font-size="12"
        font-weight="600"
        fill="#666"
        letter-spacing="2.5">SKILLED WORKERS • REAL JOBS • ONE HUB</text>
</svg>
