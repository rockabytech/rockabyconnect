<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7b733"/>
      <stop offset="100%" stop-color="#e09e15"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#g2)"/>
  
  <!-- Subtle background tools (faded) -->
  <g opacity="0.15" transform="translate(256, 256) scale(1.6)">
    <rect x="-60" y="-20" width="70" height="30" rx="10" fill="#1a1a2e"/>
    <rect x="-33" y="8" width="16" height="70" rx="6" fill="#1a1a2e"/>
    <circle cx="48" cy="-8" r="22" fill="none" stroke="#1a1a2e" stroke-width="11"/>
    <rect x="40" y="12" width="16" height="66" rx="6" fill="#1a1a2e"/>
  </g>
  
  <!-- FUNDI in dark charcoal -->
  <text x="256" y="215" text-anchor="middle"
        font-family="Poppins, Inter, sans-serif"
        font-size="105" font-weight="900"
        fill="#1a1a2e" letter-spacing="-3">FUNDI</text>
  
  <!-- HUB in white -->
  <text x="256" y="325" text-anchor="middle"
        font-family="Poppins, Inter, sans-serif"
        font-size="105" font-weight="900"
        fill="#ffffff" letter-spacing="5">HUB</text>
  
  <!-- White smile curve -->
  <path d="M 140 360 Q 256 395 372 360"
        stroke="#ffffff" stroke-width="11"
        fill="none" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Uganda Red UG badge (centered, under the smile, smaller) -->
  <rect x="216" y="415" width="80" height="80" rx="18" fill="#E30D0D"/>
  <text x="256" y="470" text-anchor="middle"
        font-family="Poppins, Inter, sans-serif"
        font-size="38" font-weight="900"
        fill="#ffffff" letter-spacing="1">UG</text>
</svg>
