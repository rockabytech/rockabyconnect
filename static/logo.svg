<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Red gradient (Uganda red) -->
    <linearGradient id="ugRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E30D0D"/>
      <stop offset="100%" stop-color="#B80000"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed red background -->
  <rect width="512" height="512" rx="115" fill="url(#ugRed)"/>

  <!-- Subtle background tools (faded black) -->
  <g opacity="0.12" transform="translate(256, 256) scale(1.6)">
    <rect x="-60" y="-20" width="70" height="30" rx="10" fill="#000000"/>
    <rect x="-33" y="8" width="16" height="70" rx="6" fill="#000000"/>
    <circle cx="48" cy="-8" r="22" fill="none" stroke="#000000" stroke-width="11"/>
    <rect x="40" y="12" width="16" height="66" rx="6" fill="#000000"/>
  </g>

  <!-- "FUNDI" in Uganda Yellow -->
  <text x="256" y="230"
        text-anchor="middle"
        font-family="Poppins, Inter, sans-serif"
        font-size="110"
        font-weight="900"
        fill="#FCDC04"
        letter-spacing="-3">FUNDI</text>

  <!-- "HUB" in Uganda Yellow -->
  <text x="256" y="345"
        text-anchor="middle"
        font-family="Poppins, Inter, sans-serif"
        font-size="110"
        font-weight="900"
        fill="#FCDC04"
        letter-spacing="5">HUB</text>

  <!-- Smile curve in Black (Uganda flag stripe) -->
  <path d="M 130 380 Q 256 415 382 380"
        stroke="#000000"
        stroke-width="12"
        fill="none"
        stroke-linecap="round"
        opacity="0.9"/>
</svg>
