<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="400" height="130">
  <defs>
    <!-- Orange gradient background -->
    <linearGradient id="fundiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7b733"/>
      <stop offset="50%" stop-color="#f5af19"/>
      <stop offset="100%" stop-color="#e09e15"/>
    </linearGradient>

    <!-- Soft shadow under the icon -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ========== ICON: FUNDI HUB inside the orange square ========== -->
  <g filter="url(#iconShadow)">
    <!-- Rounded square background -->
    <rect x="10" y="15" width="100" height="100" rx="24" fill="url(#fundiGradient)"/>

    <!-- Small hammer + wrench icon at top (subtle, decorative) -->
    <g transform="translate(60, 32) scale(0.32) translate(-60, -60)" opacity="0.95">
      <!-- Hammer -->
      <rect x="28" y="42" width="22" height="10" rx="3" fill="#ffffff"/>
      <rect x="37" y="50" width="5" height="28" rx="2" fill="#ffffff"/>
      <!-- Wrench -->
      <circle cx="78" cy="46" r="7" fill="none" stroke="#ffffff" stroke-width="3.5"/>
      <rect x="75.5" y="51" width="5" height="27" rx="2" fill="#ffffff"/>
    </g>

    <!-- "FUNDI" text -->
    <text x="60" y="70"
          text-anchor="middle"
          font-family="Poppins, Inter, Montserrat, Arial, sans-serif"
          font-size="19"
          font-weight="900"
          fill="#1a1a2e"
          letter-spacing="-0.5">FUNDI</text>

    <!-- "HUB" text -->
    <text x="60" y="92"
          text-anchor="middle"
          font-family="Poppins, Inter, Montserrat, Arial, sans-serif"
          font-size="19"
          font-weight="900"
          fill="#ffffff"
          letter-spacing="1">HUB</text>

    <!-- Smile curve at bottom -->
    <path d="M 32 100 Q 60 110 88 100" 
          stroke="#ffffff" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.9"/>
  </g>

  <!-- ========== WORDMARK (optional, next to icon) ========== -->
  <!-- Uncomment these if you also want the wordmark next to the icon -->

  <!--
  <text x="135" y="78"
        font-family="Poppins, Inter, Montserrat, Arial, sans-serif"
        font-size="48"
        font-weight="900"
        fill="#1a1a2e"
        letter-spacing="-2">FUNDI</text>
  <text x="310" y="78"
        font-family="Poppins, Inter, Montserrat, Arial, sans-serif"
        font-size="48"
        font-weight="900"
        fill="#f5af19"
        letter-spacing="-2">HUB</text>
  -->
</svg>
